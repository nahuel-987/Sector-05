<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer - Hack the School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-dark text-light">

    <main class="container min-vh-100 d-flex justify-content-center align-items-center">
        <section class="card bg-black text-light text-center p-4">
            <h1>HACK THE SCHOOL</h1>
            <h2 class="h5">SECTOR 01</h2>

            <p id="temporizador" class="display-1 fw-bold">03:00</p>

            <div id="mensaje" class="alert alert-secondary">
                Presioná INICIAR para comenzar
            </div>

            <div class="d-flex gap-2 justify-content-center">
                <button id="btnIniciar" class="btn btn-success">INICIAR</button>
                <button id="btnReiniciar" class="btn btn-warning">REINICIAR</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
